name: online_course_platform
description: A complete online course platform built with Flutter and Firebase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.3.0

  # State Management
  provider: ^6.1.2

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  url_launcher: ^6.3.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
